<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | ProjectMatch</title>
</head>

<body>

    <div id="app">

        <nav class="navbar">
            <div class="logo">
                <a href="index.html">ProjectMatch</a>
            </div>

            <div class="nav-links">
                <a href="discover.html">Discover</a>
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
            </div>
        </nav>


        <main class="auth-page">

            <section class="auth-card">

                <p class="hero-label">
                    JOIN PROJECTMATCH
                </p>

                <h1>
                    Create your account
                </h1>

                <p class="auth-description">
                    Find projects, build your profile,
                    and meet your next teammates.
                </p>


                <form id="signup-form">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            required
                            autocomplete="username"
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            minlength="6"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            minlength="6"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-button auth-button"
                    >
                        Create Account
                    </button>


                    <p
                        id="signup-error"
                        class="error-message"
                        style="display: none;"
                    >
                    </p>

                </form>


                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">
                        Log in
                    </a>
                </p>

            </section>

        </main>

    </div>


    <script
        type="module"
        src="/src/signup.js">
    </script>

</body>

</html>
